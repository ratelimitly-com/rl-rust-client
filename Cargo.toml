[package]
name = "ratelimitly"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Official Rust client for Ratelimitly distributed admission control"
readme = "README.md"
homepage = "https://ratelimitly.com/"
repository = "https://github.com/ratelimitly-com/rl-rust-client"
documentation = "https://docs.rs/ratelimitly"
license = "MIT"
keywords = ["rate-limiting", "admission-control", "distributed", "latency", "async"]
categories = ["asynchronous", "network-programming"]
publish = ["crates-io"]
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/docs/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[dependencies]
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
hickory-resolver = { version = "0.26.1", default-features = false, features = ["system-config", "tokio"] }
aes-gcm = "0.10"
thiserror = "2.0"
bytes = "1"
uuid = { version = "1", features = ["v4"] }

rand = "0.10"
blake2 = "0.11"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
socket2 = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
hickory-proto = "0.26.1"
proptest = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
