name: Bug report
description: Report a reproducible problem in the public Rust client
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve rl-rust-client. Do not include API keys,
        private packet captures, customer data, or suspected vulnerabilities.
        Use the private security-report link instead when security may be involved.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials and sensitive data from this report.
          required: true
        - label: This is not a suspected security vulnerability.
          required: true
  - type: input
    id: version
    attributes:
      label: Crate version or commit
      placeholder: 0.1.0 or a full commit hash
    validations:
      required: true
  - type: input
    id: rust
    attributes:
      label: Rust and Cargo versions
      description: Paste the output of `rustc --version` and `cargo --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Ubuntu 24.04 aarch64, macOS 15 aarch64, or Windows 2025 x86_64
    validations:
      required: true
  - type: dropdown
    id: operation
    attributes:
      label: Affected operation
      options:
        - Client construction or DNS discovery
        - Resource request
        - Latency report
        - Request policy or HA behavior
        - Packaging, documentation, or build
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe the behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide compilable Rust or exact commands using placeholders or synthetic credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and redacted output
    validations:
      required: true
