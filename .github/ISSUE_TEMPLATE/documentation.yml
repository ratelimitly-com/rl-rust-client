name: Documentation problem
description: Report missing, inaccurate, or unclear public documentation
title: "Docs: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: Link the README, guide, rustdoc item, or example.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, inaccurate, ambiguous, or difficult to follow?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Optional wording, structure, or example.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This report contains no real API key or sensitive customer data.
          required: true
