name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out rl-rust-client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        id: toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Cargo.lock is gitignored, so it cannot key the cache; Cargo.toml plus the
      # rustc fingerprint is the closest stable identity available.
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ github.job }}-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ github.job }}-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build public documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  test:
    name: test (${{ matrix.target }}, rust ${{ matrix.channel }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Newest semver-compatible dependencies on every supported native
          # target. The labels deliberately cover both x86_64 and aarch64.
          - target: linux-x86_64
            runner: ubuntu-latest
            channel: stable
            resolver: allow
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            channel: stable
            resolver: allow
          - target: macos-x86_64
            runner: macos-15-intel
            channel: stable
            resolver: allow
          - target: macos-aarch64
            runner: macos-latest
            channel: stable
            resolver: allow
          - target: windows-x86_64
            runner: windows-latest
            channel: stable
            resolver: allow
          # MSRV, mirrors `rust-version` in Cargo.toml. `fallback` makes Cargo
          # pick the newest dependency versions that still support the declared
          # `rust-version`; without it the floating (uncommitted) lockfile drags
          # in transitive crates that demand a newer rustc than the MSRV.
          - target: linux-x86_64-msrv
            runner: ubuntu-latest
            channel: '1.88'
            resolver: fallback
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: ${{ matrix.resolver }}
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: Check out rl-rust-client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ matrix.channel }}
        id: toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ matrix.channel }}

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ github.job }}-${{ matrix.target }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ github.job }}-${{ matrix.target }}-${{ steps.toolchain.outputs.cachekey }}-

      - name: Record resolved toolchain
        run: |
          rustc --version
          cargo --version

      - name: Run tests
        run: cargo test --all-features

  package:
    name: packaged crate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out rl-rust-client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Verify exact package contents and extracted crate
        run: bash tools/check-package.sh

  dependencies:
    name: dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out rl-rust-client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: "1.88.0"
          command: check
          arguments: --all-features
