name: dependency drift

on:
  schedule:
    - cron: '22 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-drift
  cancel-in-progress: true

# Build and test against the unpinned future — newest toolchain, newest upstream
# dependency — so breakage shows up on a Monday morning instead of at a customer.
# Nothing here is cached: fresh resolution is the entire point.
jobs:
  latest-deps:
    name: latest dependencies / stable
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out rl-rust-client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Resolve newest semver-compatible dependencies
        run: |
          cargo update
          {
            echo "### Resolved direct dependencies"
            echo '```'
            cargo tree --depth 1 --edges normal
            echo '```'
            echo "rustc: $(rustc --version)"
            echo "cargo: $(cargo --version)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

  beta-toolchain:
    name: beta toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out rl-rust-client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust beta
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: beta

      - name: Record beta toolchain
        run: |
          {
            echo "### Beta toolchain"
            echo "rustc: $(rustc --version)"
            echo "cargo: $(cargo --version)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build all targets on beta
        run: cargo build --all-targets --all-features

      - name: Run tests on beta
        run: cargo test --all-features
