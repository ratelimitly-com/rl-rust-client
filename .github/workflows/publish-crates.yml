name: publish-crates

on:
  workflow_dispatch:
    inputs:
      version:
        description: Cargo.toml version to publish to crates.io, without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified crate to crates.io
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CRATE_NAME: ratelimitly
      VERSION: ${{ inputs.version }}
    steps:
      - name: Require the default branch and a numeric version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "crates.io publishing must be dispatched from main" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be numeric MAJOR.MINOR.PATCH without a v prefix" >&2
            exit 1
          fi

      - name: Check out rl-rust-client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Verify release metadata and version
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(cargo metadata --format-version 1 --no-deps --offline)"
          package_count="$(jq '[.packages[]] | length' <<<"$manifest")"
          if [[ "$package_count" != 1 ]]; then
            echo "expected exactly one workspace package, found $package_count" >&2
            exit 1
          fi
          crate_name="$(jq -r '.packages[0].name' <<<"$manifest")"
          if [[ "$crate_name" != "$CRATE_NAME" ]]; then
            echo "Cargo.toml declares '$crate_name', workflow expects '$CRATE_NAME'" >&2
            exit 1
          fi
          canonical_version="$(jq -r '.packages[0].version' <<<"$manifest")"
          if [[ "$canonical_version" != "$VERSION" ]]; then
            echo "Cargo.toml version '$canonical_version' does not match requested version '$VERSION'" >&2
            exit 1
          fi
          echo "Verified $CRATE_NAME $VERSION metadata in Cargo.toml"

      - name: Run package validation and tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --all-features
          bash tools/check-package.sh

      - name: Publish crate to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN / CRATES_IO_TOKEN secret is not set" >&2
            exit 1
          fi
          cargo publish --token "${CARGO_REGISTRY_TOKEN}"
